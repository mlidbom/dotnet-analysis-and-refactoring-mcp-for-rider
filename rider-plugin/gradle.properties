kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.configuration-cache=false

# Plugin version. The release workflow overrides it from the git tag (v1.2.3 -> 1.2.3).
pluginVersion=0.14.1

# The Rider to build the frontend against when no local install is given (CI): the version of the ReSharper SDK the
# .NET part is built against.
platformVersion=2026.3

# Local builds may build against an installed Rider instead of downloading one. Don't commit a machine path here:
# set it in your user gradle.properties (~/.gradle/gradle.properties) or pass -P, e.g.:
#   localIdePath=C:/Users/you/AppData/Local/Programs/Rider
